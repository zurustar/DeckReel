name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: ./scripts/build-app.sh
      - run: ./scripts/build-cli.sh
      - run: ./dist/deckreel --version
      - run: ./dist/deckreel --help
